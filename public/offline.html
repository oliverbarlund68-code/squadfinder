
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>SquadFinder - Offline</title>
  <style>
    body {
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }

    main {
      padding: 30px;
    }

    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #7c3aed;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>SquadFinder</h1>
    <h2>Você está offline!</h2>
    <p>Verifique sua conexão com a internet.</p>
    <button onclick="location.reload()">
      Tentar novamente
    </button>
  </main>
</body>
</html>
